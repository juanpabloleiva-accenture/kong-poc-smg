_format_version: "3.0"
services:
  - name: mobile-svc
    url: http://mobile-mock.poc-backends.svc.cluster.local:80
    routes:
      - name: mobile-route
        paths:
          - /mobile
        strip_path: true
        plugins:
          - name: openid-connect
            config:
              issuer: "http://mock-oauth2.poc-support.svc.cluster.local:8080/smg-poc"
              auth_methods:
                - bearer
              scopes_required:
                - "mobile.read"
              verify_signature: true
          - name: http-log
            config:
              http_endpoint: "http://siem-mock.poc-support.svc.cluster.local:8080/ac7b9c4b-12c2-4214-b779-d98d737ab899"
              method: POST
              content_type: "application/json"
              custom_fields_by_lua:
                request.headers.authorization: "return '[MASKED]'"
                request.headers.Authorization: "return '[MASKED]'"
                request.headers.token: "return '[MASKED]'"
                request.querystring.token: "return '[MASKED]'"
                request.querystring.password: "return '[MASKED]'"
  - name: sgi-svc
    url: http://sgi-mock.poc-backends.svc.cluster.local:80
    routes:
      - name: sgi-route
        paths:
          - /sgi
        strip_path: true
  - name: prestadores-svc
    url: http://prestadores-mock.poc-backends.svc.cluster.local:80
    routes:
      - name: prestadores-route
        paths:
          - /prestadores
        strip_path: true
