_format_version: "3.0"
services:
  - name: mobile-svc
    url: http://mobile-mock.poc-backends.svc.cluster.local:80
    routes:
      - name: mobile-route
        paths:
          - /mobile
        strip_path: true
        plugins:
          - name: openid-connect
            config:
              issuer: "http://mock-oauth2.poc-support.svc.cluster.local:8080/smg-poc"
              auth_methods:
                - bearer
              scopes_required:
                - "mobile.read"
              verify_signature: true
  - name: sgi-svc
    url: http://sgi-mock.poc-backends.svc.cluster.local:80
    routes:
      - name: sgi-route
        paths:
          - /sgi
        strip_path: true
  - name: prestadores-svc
    url: http://prestadores-mock.poc-backends.svc.cluster.local:80
    routes:
      - name: prestadores-route
        paths:
          - /prestadores
        strip_path: true
