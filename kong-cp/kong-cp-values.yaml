image:
  repository: kong/kong-gateway
  tag: "3.6"
env:
  role: control_plane
  cluster_mtls: "pki"
  database: postgres
  pg_host: "kong-poc-pg.c2zos4g8u0se.us-east-1.rds.amazonaws.com"
  pg_port: "5432"
  pg_user: kong
  pg_password:
    valueFrom:
      secretKeyRef:
        name: kong-pg-config
        key: password
  pg_database: kong
  pg_ssl: "on"
  pg_ssl_verify: "off"
  cluster_cert: /etc/secrets/kong-cluster-cert/tls.crt
  cluster_cert_key: /etc/secrets/kong-cluster-cert/tls.key
  lua_ssl_trusted_certificate: /etc/secrets/kong-cluster-ca/ca.crt
  cluster_ca_cert: /etc/secrets/kong-cluster-ca/ca.crt
enterprise:
  enabled: true
  license_secret: kong-enterprise-license
admin:
  enabled: true
  type: LoadBalancer
  loadBalancerSourceRanges:
    - 190.137.116.134/32
  http:
    enabled: true
    servicePort: 8001
manager:
  enabled: true
  type: LoadBalancer
  loadBalancerSourceRanges:
    - 190.137.116.134/32
  http:
    enabled: true
    servicePort: 8002
cluster:
  enabled: true
  type: LoadBalancer
  loadBalancerSourceRanges:
    - 190.137.116.134/32
  tls:
    enabled: true
    servicePort: 8005
clustertelemetry:
  enabled: true
  type: LoadBalancer
  loadBalancerSourceRanges:
    - 190.137.116.134/32
  tls:
    enabled: true
    servicePort: 8006
proxy:
  enabled: false
ingressController:
  enabled: false
migrations:
  preUpgrade: true
  postUpgrade: true
secretVolumes:
  - kong-cluster-cert
  - kong-cluster-ca
