apiVersion: apps/v1
kind: Deployment
metadata:
  name: sgi-mock
  namespace: poc-backends
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sgi-mock
  template:
    metadata:
      labels:
        app: sgi-mock
    spec:
      containers:
        - name: sgi-mock
          image: mendhak/http-https-echo:31
          ports:
            - containerPort: 8080
          env:
            - name: HTTP_PORT
              value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: sgi-mock
  namespace: poc-backends
spec:
  selector:
    app: sgi-mock
  ports:
    - port: 80
      targetPort: 8080
