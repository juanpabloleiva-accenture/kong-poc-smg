---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mobile-mock
  namespace: poc-backends
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mobile-mock
  template:
    metadata:
      labels:
        app: mobile-mock
    spec:
      containers:
        - name: mobile-mock
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: data
          configMap:
            name: mobile-mock-data
---
apiVersion: v1
kind: Service
metadata:
  name: mobile-mock
  namespace: poc-backends
spec:
  selector:
    app: mobile-mock
  ports:
    - port: 80
      targetPort: 80
